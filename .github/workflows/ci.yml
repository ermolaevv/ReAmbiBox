name: CI & Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Package & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress

      - name: Build & package portable release and installer
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path target/dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
              "$hash  $($_.Name)"
            }
          $lines | Out-File -FilePath target/dist/SHA256SUMS.txt -Encoding utf8
          Get-Content target/dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReAmbiBox-windows-x64
          path: target/dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/*
          generate_release_notes: true

