[package]
name = "reambibox-app"
version = "0.1.0"
edition = "2021"
authors = ["ReAmbiBox Authors"]
description = "ReAmbiBox Application Entry Point"

[dependencies]
reambibox-core = { path = "../reambibox-core" }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
winreg = "0.52"

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"

