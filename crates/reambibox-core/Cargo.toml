[package]
name = "reambibox-core"
version = "1.0.0"
edition = "2021"
authors = ["ReAmbiBox Authors"]
description = "Core high-performance capture, color processing, and device driver engine for ReAmbiBox"

[dependencies]
# Windows API for DXGI Desktop Duplication, Direct3D 11, and WASAPI Audio
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Com",
] }

# Serial communication (Adalight, AtmoLight, etc.)
serialport = "4.6"

# Async runtime & Networking (Lightpack API TCP 3636)
tokio = { version = "1", features = ["full"] }

# Multi-threading & Lock-free synchronization
crossbeam = "0.8"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & Logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"

